# =============================================================================
# benchmark.yml — MI300A Linear Finishable-Size Benchmark Workflow
# =============================================================================
#
# Default path is intentionally linear and finishable-size only:
#   Validation -> Tier 1 -> Tier-1 summary/gate -> Tier 2 -> Summary
#
# The Tier 1 and Tier 2 matrices are loaded only from the checked-in finishable
# views:
#   benchmark-comparison/generated/mi300a_finishable_tier1_matrix.json
#   benchmark-comparison/generated/mi300a_finishable_tier2_matrix.json
# and those views are validated against:
#   benchmark-comparison/mi300a_finishable_size_manifest.json
# before any simulator job starts.
#
# Archived observation contract: GitHub Actions run 24959959195 is preserved here only as
# an immutable observation-time / bounded non-terminal snapshot. It is not a
# final/current live finishability claim. The maintained default matrices use the
# checked-in manifest/view eligibility produced from that bounded snapshot.
#
# Legacy curated-primary, focused-near-miss-stencil-single, exploratory, and
# problem-size-discovery dispatch modes were removed from this default workflow
# rather than kept as additional modes. The historical manifests/provenance stay
# checked in for auditability, but benchmark.yml now has one default path.
# =============================================================================
name: MI300A Benchmark

concurrency:
  group: archived-full-run-contract-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/tag/SHA) to benchmark'
        required: false
        default: ''
        type: string

jobs:
  # ==========================================================================
  # Archived MI300A full-run terminal-discovery launch/readiness path.
  #
  # This archived operator path is active only for `archived-full-run-contract`. It reuses the
  # registered `.github/workflows/benchmark.yml` path without adding a visible
  # terminal-discovery workflow or a `run_mode` input. It materializes 81 visible
  # benchmark rows over the full 1416-entry terminal plan and writes one fresh
  # neutral source identity for the archived full-run contract.
  # ==========================================================================
  archived-full-run-validation:
    name: "Archived full-run contract: validate full 1416-entry plan"
    if: ${{ (github.event.inputs.ref || github.ref_name) == 'archived-full-run-contract' }}
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      terminal_matrix: ${{ steps.matrix.outputs.terminal_matrix }}
      benchmark_row_count: ${{ steps.matrix.outputs.benchmark_row_count }}
      attempt_count: ${{ steps.matrix.outputs.attempt_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Check Python
        run: python3 --version

      - name: Validate terminal-discovery shard contract
        run: python3 scripts/validate_mi300a_terminal_discovery_shards.py

      - name: Validate archived full-run row timeout contract
        run: |
          set -euo pipefail
          python3 scripts/validate_mi300a_terminal_discovery_timeout_contract.py \
            --row-timeout-minutes 4320 \
            --per-attempt-timeout-sec 3600 \
            --row-overhead-sec 1800 > archived_full_run_timeout_contract.json
          python3 - <<'PY'
          import json
          report = json.load(open('archived_full_run_timeout_contract.json', encoding='utf-8'))
          assert report['validated'] is True
          assert report['attempt_count'] == 1416
          assert report['row_count'] == 81
          assert report['violation_count'] == 0
          PY

      - name: Materialize compact benchmark-row matrix
        id: matrix
        run: python3 scripts/archived_terminal_discovery_operator.py matrix

      - name: Upload terminal-evidence validation summaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-full-run-validation
          path: |
            archived_full_run_matrix_summary.md
            archived_full_run_timeout_contract.json
          if-no-files-found: error
          retention-days: 30

  archived-full-run-discovery:
    name: "Archived Full-Run Contract: ${{ matrix.benchmark }}"
    if: ${{ (github.event.inputs.ref || github.ref_name) == 'archived-full-run-contract' }}
    runs-on: self-hosted
    timeout-minutes: 4320
    needs: [archived-full-run-validation]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs['archived-full-run-validation'].outputs.terminal_matrix) }}
    env:
      GOMEMLIMIT: 4GiB
      GOGC: '50'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install gcc (Fedora self-hosted runners)
        run: |
          if command -v gcc &>/dev/null; then
            echo "gcc already installed: $(gcc --version | head -1)"
          elif command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo dnf failed, hoping gcc is on PATH"
          fi
          command -v gcc || { echo "ERROR: gcc not found"; exit 1; }

      - name: Run benchmark-level terminal-evidence attempts
        run: |
          set -euo pipefail
          python3 scripts/archived_terminal_discovery_operator.py run-row \
            --shard-index '${{ matrix.shard_index }}' \
            --matrix-row-id '${{ matrix.matrix_row_id }}' \
            --output-dir terminal-discovery-row-output

      - name: Upload benchmark-level terminal-evidence outcomes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-full-run-outcomes-${{ matrix.matrix_row_id }}
          path: terminal-discovery-row-output/
          if-no-files-found: error
          retention-days: 30

  archived-full-run-summary:
    name: "Archived full-run contract: collect provenance"
    if: ${{ always() && (github.event.inputs.ref || github.ref_name) == 'archived-full-run-contract' }}
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [archived-full-run-validation, archived-full-run-discovery]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Check Python
        run: python3 --version

      - name: Download benchmark-level terminal-evidence artifacts
        uses: actions/download-artifact@v4
        with:
          path: terminal-discovery-artifacts/
          pattern: archived-full-run-outcomes-*

      - name: Verify exact terminal outcome coverage
        run: |
          set -euo pipefail
          python3 scripts/archived_terminal_discovery_operator.py count-outcomes \
            --outcomes-root terminal-discovery-artifacts

      - name: Collect terminal-evidence provenance
        run: |
          set -euo pipefail
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          python3 scripts/collect_mi300a_terminal_discovery_provenance.py \
            --outcomes-root terminal-discovery-artifacts \
            --output archived_full_run_provenance.json \
            --run-id '${{ github.run_id }}' \
            --run-url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --head-branch '${{ github.event.inputs.ref || github.ref_name }}' \
            --head-sha '${{ github.sha }}' \
            --created-at "${NOW}" \
            --started-at "${NOW}" \
            --updated-at "${NOW}" \
            --collected-at "${NOW}" \
            --workflow-name 'MI300A Benchmark / archived full-run contract' \
            --actor '${{ github.actor }}' \
            --dispatch-workflow '.github/workflows/benchmark.yml' \
            --collected-for 'archived_full_run_contract_provenance_only'
          python3 scripts/validate_mi300a_terminal_discovery_provenance.py \
            --provenance archived_full_run_provenance.json > archived_full_run_provenance_validation.json

      - name: Summarize terminal-evidence contract
        run: |
          set -euo pipefail
          echo "## Archived MI300A full-run contract" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Branch/ref: \`${{ github.event.inputs.ref || github.ref_name }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Commit: \`${{ github.sha }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Visible benchmark matrix rows: ${{ needs['archived-full-run-validation'].outputs.benchmark_row_count }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Nested per-size terminal attempts: ${{ needs['archived-full-run-validation'].outputs.attempt_count }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Artifact prefix: \`archived-full-run-outcomes-*\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Provenance collected only after exact 1416-record fresh single-source coverage." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload terminal-evidence provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-full-run-discovery-provenance
          path: |
            archived_full_run_provenance.json
            archived_full_run_provenance_validation.json
          if-no-files-found: error
          retention-days: 90

  # ==========================================================================
  # Validation: static/schema checks and dynamic matrix materialization.
  # ==========================================================================
  validation:
    name: "Validation: finishable-size manifests and matrices"
    if: ${{ (github.event.inputs.ref || github.ref_name) != 'archived-full-run-contract' }}
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      tier1_matrix: ${{ steps.matrix-outputs.outputs.tier1_matrix }}
      tier2_matrix: ${{ steps.matrix-outputs.outputs.tier2_matrix }}
      tier1_count: ${{ steps.matrix-outputs.outputs.tier1_count }}
      tier2_count: ${{ steps.matrix-outputs.outputs.tier2_count }}
      tier1_sizes: ${{ steps.matrix-outputs.outputs.tier1_sizes }}
      tier2_sizes: ${{ steps.matrix-outputs.outputs.tier2_sizes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Check Python
        run: python3 --version

      - name: Validate finishable-size manifest
        run: python3 scripts/validate_mi300a_finishable_size_manifest.py

      - name: Validate matrix sources and benchmark directories
        id: matrix-outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          tier_paths = {
              "tier1": Path("benchmark-comparison/generated/mi300a_finishable_tier1_matrix.json"),
              "tier2": Path("benchmark-comparison/generated/mi300a_finishable_tier2_matrix.json"),
          }
          manifest_path = Path("benchmark-comparison/mi300a_finishable_size_manifest.json")
          summary_path = Path("linear_workflow_validation_summary.md")

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schema_name") != "mgpusim.mi300a_finishable_size_manifest":
              fail(f"unexpected manifest schema_name in {manifest_path}")

          outputs = {}
          lines = [
              "# MI300A Linear Workflow Validation",
              "",
              f"Manifest: `{manifest_path}`",
              "",
              (
                  "Discovery snapshot: run `24959959195` is an immutable "
                  "observation-time / bounded non-terminal snapshot, not a "
                  "final/current live finishability claim."
              ),
              "",
              "| Tier | Matrix source | Benchmarks | Finishable sizes | Plan index ranges |",
              "|---|---|---:|---:|---|",
          ]

          expected_numeric_tiers = {"tier1": 1, "tier2": 2}

          for tier_name, path in tier_paths.items():
              matrix_doc = json.loads(path.read_text(encoding="utf-8"))
              if matrix_doc.get("source_manifest") != str(manifest_path):
                  fail(f"{path} source_manifest must be {manifest_path}")
              if matrix_doc.get("tier_name") != tier_name:
                  fail(f"{path} tier_name field mismatch: {matrix_doc.get('tier_name')!r}")
              expected_tier = expected_numeric_tiers[tier_name]
              if matrix_doc.get("tier") != expected_tier:
                  fail(
                      f"{path} tier field mismatch: "
                      f"{matrix_doc.get('tier')!r}; expected {expected_tier}"
                  )
              if matrix_doc.get("eligible_only") is not True:
                  fail(f"{path} must be eligible_only=true")

              include = matrix_doc.get("include")
              if not isinstance(include, list) or not include:
                  fail(f"{path} include must be a non-empty list")

              total_sizes = 0
              for entry in include:
                  benchmark = str(entry.get("benchmark", ""))
                  sizes = str(entry.get("sizes", "")).split()
                  if not benchmark:
                      fail(f"{path} has matrix row without benchmark")
                  if not sizes:
                      fail(f"{path} row {benchmark} has no sizes")
                  if not Path("amd/samples", benchmark).is_dir():
                      fail(f"{path} row {benchmark} has no amd/samples/{benchmark}/ directory")
                  for key in ("flag_template", "size_label_template", "timeout_sec"):
                      if str(entry.get(key, "")) == "":
                          fail(f"{path} row {benchmark} missing {key}")
                  if int(entry.get("timeout_sec")) > 3600:
                      fail(f"{path} row {benchmark} timeout exceeds 3600s")
                  total_sizes += len(sizes)

              expected_count = int(matrix_doc.get("eligible_entry_count", -1))
              if total_sizes != expected_count:
                  fail(
                      f"{path} size count {total_sizes} does not match "
                      f"eligible_entry_count {expected_count}"
                  )

              compact_matrix = {"include": include}
              outputs[f"{tier_name}_matrix"] = json.dumps(compact_matrix, separators=(",", ":"))
              outputs[f"{tier_name}_count"] = str(len(include))
              outputs[f"{tier_name}_sizes"] = str(total_sizes)
              ranges = ", ".join(matrix_doc.get("eligible_plan_index_ranges", []))
              lines.append(
                  f"| {tier_name} | `{path}` | {len(include)} | {total_sizes} | `{ranges}` |"
              )

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as f:
              for key, value in outputs.items():
                  if "\n" in value:
                      fail(f"output {key} unexpectedly contains newline")
                  f.write(f"{key}={value}\n")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(summary_path.read_text(encoding="utf-8"))
          PY

      - name: Upload validation summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-summary
          path: linear_workflow_validation_summary.md
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # Tier 1: priority microbenchmark/probe simulations.
  # ==========================================================================
  benchmark-tier1:
    name: "Tier 1 Bench: ${{ matrix.benchmark }}"
    runs-on: self-hosted
    timeout-minutes: 1440
    needs: [validation]
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix: ${{ fromJson(needs.validation.outputs.tier1_matrix) }}
    env: &benchmark_env
      GOMEMLIMIT: ${{ matrix.gomemlimit || '4GiB' }}
      GOGC: ${{ matrix.gogc || '50' }}
    steps: &benchmark_steps
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install gcc (Fedora self-hosted runners)
        run: |
          if command -v gcc &>/dev/null; then
            echo "gcc already installed: $(gcc --version | head -1)"
          elif command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo dnf failed, hoping gcc is on PATH"
          fi
          command -v gcc || { echo "ERROR: gcc not found"; exit 1; }

      - name: Check Python
        run: python3 --version

      - name: Resolve benchmark metadata
        id: benchmark-metadata
        env:
          MATRIX_BENCHMARK: ${{ matrix.benchmark }}
          MATRIX_SIZES: ${{ matrix.sizes }}
          MATRIX_FLAG_TEMPLATE: ${{ matrix.flag_template }}
          MATRIX_SIZE_LABEL_TEMPLATE: ${{ matrix.size_label_template }}
          MATRIX_EXTRA_FLAGS: ${{ matrix.extra_flags || '' }}
          MATRIX_TIMEOUT_SEC: ${{ matrix.timeout_sec || '3600' }}
          MATRIX_ARTIFACT_ID: ${{ matrix.artifact_id || matrix.benchmark }}
          MATRIX_GOMEMLIMIT: ${{ matrix.gomemlimit || '4GiB' }}
          MATRIX_GOGC: ${{ matrix.gogc || '50' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          def env(name, default=""):
              return os.environ.get(name, default)

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          metadata = {
              "benchmark": env("MATRIX_BENCHMARK"),
              "sizes": env("MATRIX_SIZES"),
              "flag_template": env("MATRIX_FLAG_TEMPLATE"),
              "size_label_template": env("MATRIX_SIZE_LABEL_TEMPLATE"),
              "extra_flags": env("MATRIX_EXTRA_FLAGS"),
              "timeout_sec": env("MATRIX_TIMEOUT_SEC", "3600"),
              "artifact_id": env("MATRIX_ARTIFACT_ID") or env("MATRIX_BENCHMARK"),
              "gomemlimit": env("MATRIX_GOMEMLIMIT", "4GiB") or "4GiB",
              "gogc": env("MATRIX_GOGC", "50") or "50",
          }
          for key in ("benchmark", "sizes", "flag_template", "size_label_template", "timeout_sec", "artifact_id"):
              if not str(metadata.get(key, "")):
                  fail(f"resolved benchmark metadata missing {key}")
          if int(metadata["timeout_sec"]) > 3600:
              fail(f"{metadata['benchmark']} timeout_sec exceeds 3600s finishable-size budget")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in metadata.items():
                  value = str(value)
                  if "\n" in value:
                      fail(f"resolved metadata value for {key} must be single-line")
                  output.write(f"{key}={value}\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"GOMEMLIMIT={metadata['gomemlimit']}\n")
              env_file.write(f"GOGC={metadata['gogc']}\n")

          print(
              "Resolved benchmark metadata: "
              f"benchmark={metadata['benchmark']} sizes={metadata['sizes']} "
              f"artifact_id={metadata['artifact_id']} timeout_sec={metadata['timeout_sec']} "
              f"gomemlimit={metadata['gomemlimit']} gogc={metadata['gogc']}"
          )
          PY

      - name: Build benchmark
        env:
          RESOLVED_BENCHMARK: ${{ steps.benchmark-metadata.outputs.benchmark }}
        run: |
          CGO_ENABLED=1 go build -o "./_bench_${RESOLVED_BENCHMARK}" "./amd/samples/${RESOLVED_BENCHMARK}/"

      - name: Run benchmark sizes
        id: run
        env:
          RESOLVED_BENCHMARK: ${{ steps.benchmark-metadata.outputs.benchmark }}
          RESOLVED_SIZES: ${{ steps.benchmark-metadata.outputs.sizes }}
          RESOLVED_FLAG_TEMPLATE: ${{ steps.benchmark-metadata.outputs.flag_template }}
          RESOLVED_SIZE_LABEL_TEMPLATE: ${{ steps.benchmark-metadata.outputs.size_label_template }}
          RESOLVED_EXTRA_FLAGS: ${{ steps.benchmark-metadata.outputs.extra_flags }}
          RESOLVED_TIMEOUT_SEC: ${{ steps.benchmark-metadata.outputs.timeout_sec }}
        run: |
          set +e

          BENCHMARK="${RESOLVED_BENCHMARK}"
          SIZES="${RESOLVED_SIZES}"
          FLAG_TEMPLATE="${RESOLVED_FLAG_TEMPLATE}"
          LABEL_TEMPLATE="${RESOLVED_SIZE_LABEL_TEMPLATE}"
          EXTRA_FLAGS="${RESOLVED_EXTRA_FLAGS}"
          COMMON_FLAGS="-timing -arch cdna3 -gpu mi300a -disable-rtm ${EXTRA_FLAGS}"
          BINARY="./_bench_${BENCHMARK}"
          TIMEOUT_SEC="${RESOLVED_TIMEOUT_SEC}"
          OUTPUT="results_${BENCHMARK}.csv"

          echo "kernel_name,problem_size,iterations,avg_ms,min_ms,max_ms" > "${OUTPUT}"
          PASS=0
          FAIL=0
          CRASH_FAIL=0

          ulimit -v 16777216 2>/dev/null || true

          for size in ${SIZES}; do
            if echo "${FLAG_TEMPLATE}" | grep -q '{p1}'; then
              p1=$(echo "${size}" | cut -d_ -f1)
              p2=$(echo "${size}" | cut -d_ -f2)
              p3=$(echo "${size}" | cut -d_ -f3)
              FLAGS=$(echo "${FLAG_TEMPLATE}" | sed "s/{p1}/${p1}/g; s/{p2}/${p2}/g; s/{p3}/${p3}/g")
              LABEL=$(echo "${LABEL_TEMPLATE}" | sed "s/{p1}/${p1}/g; s/{p2}/${p2}/g; s/{p3}/${p3}/g")
            elif echo "${size}" | grep -q ':'; then
              actual_size=$(echo "${size}" | cut -d: -f1)
              label_size=$(echo "${size}" | cut -d: -f2)
              FLAGS=$(echo "${FLAG_TEMPLATE}" | sed "s/{size}/${actual_size}/g")
              LABEL=$(echo "${LABEL_TEMPLATE}" | sed "s/{size}/${label_size}/g")
            else
              FLAGS=$(echo "${FLAG_TEMPLATE}" | sed "s/{size}/${size}/g")
              LABEL=$(echo "${LABEL_TEMPLATE}" | sed "s/{size}/${size}/g")
            fi

            echo "::group::${BENCHMARK} ${LABEL}"
            echo "[RUN] ${BENCHMARK} ${LABEL} with flags: ${COMMON_FLAGS} ${FLAGS}"

            WORK_DIR=$(mktemp -d)
            cd "${WORK_DIR}"
            timeout "${TIMEOUT_SEC}" "${OLDPWD}/${BINARY}" ${COMMON_FLAGS} ${FLAGS} > stdout.log 2>&1
            EXIT_CODE=$?
            cd "${OLDPWD}"

            if [ ${EXIT_CODE} -eq 124 ]; then
              echo "::warning::TIMEOUT: ${BENCHMARK} ${LABEL} (>${TIMEOUT_SEC}s)"
              FAIL=$((FAIL + 1))
              rm -rf "${WORK_DIR}"
              echo "::endgroup::"
              break
            fi

            if [ ${EXIT_CODE} -ne 0 ]; then
              echo "::error::CRASH: ${BENCHMARK} ${LABEL} (exit ${EXIT_CODE})"
              echo '--- CRASH OUTPUT (first 50 lines) ---'
              cat "${WORK_DIR}/stdout.log" 2>/dev/null | head -50
              echo '--- CRASH OUTPUT (last 50 lines) ---'
              cat "${WORK_DIR}/stdout.log" 2>/dev/null | tail -50
              CRASH_FAIL=$((CRASH_FAIL + 1))
              rm -rf "${WORK_DIR}"
              echo "::endgroup::"
              break
            fi

            DB_FILE=$(ls "${WORK_DIR}"/akita_sim_*.sqlite3 2>/dev/null | head -1)
            if [ -z "${DB_FILE}" ]; then
              DB_FILE=$(ls "${WORK_DIR}"/akita_data_recording_*.sqlite3 2>/dev/null | head -1)
            fi

            if [ -z "${DB_FILE}" ] || [ ! -f "${DB_FILE}" ]; then
              echo "::error::CRASH: ${BENCHMARK} ${LABEL} (no SQLite output)"
              CRASH_FAIL=$((CRASH_FAIL + 1))
              rm -rf "${WORK_DIR}"
              echo "::endgroup::"
              exit 1
            fi

            export _BENCH_DB="${DB_FILE}"
            KERNEL_TIME_SEC=$(python3 -c "import sqlite3,os; db=os.environ['_BENCH_DB']; conn=sqlite3.connect(db); c=conn.cursor(); c.execute(\"SELECT Value FROM mgpusim_metrics WHERE What='kernel_time' AND Location='Driver' LIMIT 1\"); r=c.fetchone(); r=r or (c.execute(\"SELECT Value FROM mgpusim_metrics WHERE What='kernel_time' LIMIT 1\"),c.fetchone())[1]; print(r[0]) if r else None; conn.close()" 2>/dev/null || true)

            if [ -z "${KERNEL_TIME_SEC}" ]; then
              echo "::error::CRASH: ${BENCHMARK} ${LABEL} (no kernel_time in DB)"
              CRASH_FAIL=$((CRASH_FAIL + 1))
              rm -rf "${WORK_DIR}"
              echo "::endgroup::"
              exit 1
            fi

            KERNEL_TIME_MS=$(python3 -c "v=${KERNEL_TIME_SEC}; print(f'{v/1e9:.6f}' if v > 1e6 else f'{v*1000:.6f}')")

            CSV_NAME="${BENCHMARK}"
            if [ "${BENCHMARK}" = "fft" ]; then CSV_NAME="fft1D_512"; fi
            if [ "${BENCHMARK}" = "spmv" ]; then CSV_NAME="spmv_csr_scalar"; fi
            if [ "${BENCHMARK}" = "2dconvolution" ]; then CSV_NAME="2DConvolution"; fi
            if [ "${BENCHMARK}" = "3dconvolution" ]; then CSV_NAME="3DConvolution"; fi
            if [ "${BENCHMARK}" = "backprop" ]; then CSV_NAME="layerforward"; fi
            if [ "${BENCHMARK}" = "streamcluster" ]; then CSV_NAME="streamcluster_pgain"; fi
            if [ "${BENCHMARK}" = "parboil_cutcp" ]; then CSV_NAME="cutoff_potential"; fi
            if [ "${BENCHMARK}" = "parboil_histo" ]; then CSV_NAME="histogram"; fi
            if [ "${BENCHMARK}" = "parboil_lbm" ]; then CSV_NAME="lbm_stream_collide"; fi
            if [ "${BENCHMARK}" = "parboil_mri_gridding" ]; then CSV_NAME="gridding_kernel"; fi
            if [ "${BENCHMARK}" = "parboil_mri_q" ]; then CSV_NAME="ComputeQ"; fi
            if [ "${BENCHMARK}" = "parboil_sad" ]; then CSV_NAME="ComputeSAD"; fi
            if [ "${BENCHMARK}" = "parboil_sgemm" ]; then CSV_NAME="sgemm_tiled"; fi
            if [ "${BENCHMARK}" = "parboil_spmv" ]; then CSV_NAME="spmv_csr"; fi
            if [ "${BENCHMARK}" = "parboil_stencil" ]; then CSV_NAME="stencil_kernel"; fi
            if [ "${BENCHMARK}" = "parboil_tpacf" ]; then CSV_NAME="tpacf_DD"; fi
            if [ "${BENCHMARK}" = "bus_speed_download" ]; then CSV_NAME="BusSpeedDownload"; fi
            if [ "${BENCHMARK}" = "bus_speed_readback" ]; then CSV_NAME="BusSpeedReadback"; fi
            if [ "${BENCHMARK}" = "device_memory_read" ]; then CSV_NAME="DeviceMemory_Read"; fi
            if [ "${BENCHMARK}" = "device_memory_write" ]; then CSV_NAME="DeviceMemory_Write"; fi
            if [ "${BENCHMARK}" = "max_flops" ]; then CSV_NAME="MaxFlops"; fi
            if [ "${BENCHMARK}" = "md_lj" ]; then CSV_NAME="md"; fi
            if [ "${BENCHMARK}" = "md5hash" ]; then CSV_NAME="md5hash"; fi
            if [ "${BENCHMARK}" = "qtc" ]; then CSV_NAME="qtc"; fi
            if [ "${BENCHMARK}" = "sssp" ]; then CSV_NAME="sssp_relax_kernel"; fi
            if [ "${BENCHMARK}" = "bh" ]; then CSV_NAME="compute_forces_kernel"; fi
            if [ "${BENCHMARK}" = "dmr" ]; then CSV_NAME="identify_bad_triangles"; fi

            echo "${CSV_NAME},${LABEL},1,${KERNEL_TIME_MS},${KERNEL_TIME_MS},${KERNEL_TIME_MS}" >> "${OUTPUT}"
            echo "[OK] ${BENCHMARK} ${LABEL} -> ${KERNEL_TIME_MS} ms"

            if [ "${BENCHMARK}" = "parboil_sad" ]; then
              FINDMIN_OUTPUT="results_findminsad.csv"
              if [ ! -f "${FINDMIN_OUTPUT}" ]; then
                echo "kernel_name,problem_size,num_runs,avg_ms,min_ms,max_ms" > "${FINDMIN_OUTPUT}"
              fi
              extract_per_kernel_ms() {
                python3 - "${WORK_DIR}/stdout.log" "${BENCHMARK}" "${LABEL}" "$1" <<'PY'
          import math
          import sys

          stdout_path, benchmark, size_label, kernel = sys.argv[1:5]
          needle = f"PER_KERNEL_TIME {kernel}"
          valid_value = None
          try:
              with open(stdout_path, "r", encoding="utf-8", errors="replace") as f:
                  for line in f:
                      if needle not in line:
                          continue
                      parts = line.strip().split()
                      if len(parts) < 3:
                          print(f"::warning::PER_KERNEL_TIME_SKIP benchmark={benchmark} size={size_label} kernel={kernel} raw_token=<missing> reason=missing_token", file=sys.stderr)
                          continue
                      raw_token = parts[2]
                      try:
                          value = float(raw_token)
                      except ValueError:
                          print(f"::warning::PER_KERNEL_TIME_SKIP benchmark={benchmark} size={size_label} kernel={kernel} raw_token={raw_token} reason=non_numeric", file=sys.stderr)
                          continue
                      if not math.isfinite(value):
                          print(f"::warning::PER_KERNEL_TIME_SKIP benchmark={benchmark} size={size_label} kernel={kernel} raw_token={raw_token} reason=non_finite", file=sys.stderr)
                          continue
                      if valid_value is None:
                          valid_value = value
                      else:
                          print(f"::warning::PER_KERNEL_TIME_SKIP benchmark={benchmark} size={size_label} kernel={kernel} raw_token={raw_token} reason=extra_numeric_token_ignored", file=sys.stderr)
          except FileNotFoundError:
              print(f"::warning::PER_KERNEL_TIME_SKIP benchmark={benchmark} size={size_label} kernel={kernel} raw_token=<missing> reason=stdout_log_missing", file=sys.stderr)
          if valid_value is None:
              sys.exit(0)
          ms = valid_value / 1e9 if valid_value > 1e6 else valid_value * 1000
          print(f"{ms:.6f}")
          PY
              }
              COMPUTESAD_MS=$(extract_per_kernel_ms ComputeSAD)
              FINDMINSAD_MS=$(extract_per_kernel_ms FindMinSAD)
              if [ -n "${COMPUTESAD_MS}" ]; then
                sed -i'' "\$d" "${OUTPUT}"
                echo "ComputeSAD,${LABEL},1,${COMPUTESAD_MS},${COMPUTESAD_MS},${COMPUTESAD_MS}" >> "${OUTPUT}"
              fi
              if [ -n "${FINDMINSAD_MS}" ]; then
                echo "FindMinSAD,${LABEL},1,${FINDMINSAD_MS},${FINDMINSAD_MS},${FINDMINSAD_MS}" >> "${FINDMIN_OUTPUT}"
              fi
            fi

            PASS=$((PASS + 1))
            rm -rf "${WORK_DIR}"
            echo "::endgroup::"
          done

          echo ""
          echo "=== Summary: ${BENCHMARK} ==="
          echo "  Passed: ${PASS}"
          echo "  Failed/timeouts: ${FAIL}"
          echo "  Crash failures: ${CRASH_FAIL}"
          echo "  Total attempted: $((PASS + FAIL + CRASH_FAIL))"
          echo "pass_count=${PASS}" >> "${GITHUB_OUTPUT}"
          echo "fail_count=${FAIL}" >> "${GITHUB_OUTPUT}"
          cat "${OUTPUT}"

          if [ ${CRASH_FAIL} -gt 0 ] || [ ${FAIL} -gt 0 ] || [ ${PASS} -eq 0 ]; then
            echo "::error::${BENCHMARK}: finishable-size job did not produce complete usable data"
            exit 1
          fi
          exit 0

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ steps.benchmark-metadata.outputs.artifact_id || matrix.artifact_id || matrix.benchmark || 'unknown' }}
          path: |
            results_${{ steps.benchmark-metadata.outputs.benchmark || matrix.benchmark || 'unknown' }}.csv
            results_findminsad.csv
          if-no-files-found: ignore
          retention-days: 30

  # ==========================================================================
  # Tier-1 summary/gate: concise early diagnosis and pass/fail gate for Tier 2.
  # ==========================================================================
  tier1-gate:
    name: "Tier-1 summary/gate"
    runs-on: self-hosted
    timeout-minutes: 10
    needs: [validation, benchmark-tier1]
    if: ${{ always() && (github.event.inputs.ref || github.ref_name) != 'archived-full-run-contract' }}
    steps:
      - name: Download Tier 1 benchmark artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: tier1-artifacts/
          pattern: benchmark-results-*

      - name: Summarize Tier 1 outputs
        run: |
          set -euo pipefail
          echo "## Tier 1 Summary/Gate" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Expected matrix rows: ${{ needs.validation.outputs.tier1_count }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Expected finishable sizes: ${{ needs.validation.outputs.tier1_sizes }}" >> "${GITHUB_STEP_SUMMARY}"
          read RESULT_FILES DATA_ROWS <<EOF
          $(python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('tier1-artifacts').glob('**/results_*.csv'))
          rows = 0
          for path in files:
              with path.open(encoding='utf-8', errors='replace') as f:
                  next(f, None)
                  rows += sum(1 for _ in f)
          print(len(files), rows)
          PY
          )
          EOF
          echo "Downloaded result files: ${RESULT_FILES}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Downloaded data rows: ${DATA_ROWS}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Tier 1 job result: ${{ needs['benchmark-tier1'].result }}" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${{ needs['benchmark-tier1'].result }}" != "success" ]; then
            echo "::error::Tier 1 did not complete successfully; Tier 2 is gated off."
            exit 1
          fi

  # ==========================================================================
  # Tier 2: application/secondary benchmark simulations after Tier 1 gate.
  # ==========================================================================
  benchmark-tier2:
    name: "Tier 2 Bench: ${{ matrix.benchmark }}"
    runs-on: self-hosted
    timeout-minutes: 1440
    needs: [validation, tier1-gate]
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix: ${{ fromJson(needs.validation.outputs.tier2_matrix) }}
    env: *benchmark_env
    steps: *benchmark_steps

  # ==========================================================================
  # Summary: final artifact collection, merge, comparison, report upload.
  # ==========================================================================
  summary:
    name: "Summary: merge, compare, and report"
    runs-on: self-hosted
    timeout-minutes: 15
    needs: [validation, benchmark-tier1, tier1-gate, benchmark-tier2]
    if: ${{ always() && (github.event.inputs.ref || github.ref_name) != 'archived-full-run-contract' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install build dependencies
        run: |
          if command -v gcc &>/dev/null; then
            echo "gcc already installed: $(gcc --version | head -1)"
          elif command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo dnf failed, hoping gcc is on PATH"
          fi

      - name: Check Python
        run: python3 --version

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: benchmark-artifacts/
          pattern: benchmark-results-*

      - name: Merge benchmark results
        run: |
          set -euo pipefail
          echo "kernel_name,problem_size,iterations,avg_ms,min_ms,max_ms" > sim_results_ci.csv
          TOTAL_LINES=0
          python3 - <<'PY'
          from pathlib import Path

          out = Path('sim_results_ci.csv')
          files = sorted(Path('benchmark-artifacts').glob('**/results_*.csv'))
          total = 0
          with out.open('a', encoding='utf-8') as dst:
              for path in files:
                  with path.open(encoding='utf-8', errors='replace') as src:
                      next(src, None)
                      for line in src:
                          dst.write(line)
                          total += 1
          print(f"=== Merged {total} result lines ===")
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Resolve reference CSV
        id: reference
        run: |
          REF_CSV=$(ls -1t workloads/results/kernel_timings_*.csv 2>/dev/null | head -1 || true)
          if [ -n "${REF_CSV}" ]; then
            echo "Using reference CSV: ${REF_CSV}"
          else
            echo "::warning::No workloads/results/kernel_timings_*.csv found; comparison steps will use empty fallback outputs."
          fi
          echo "ref_csv=${REF_CSV}" >> "${GITHUB_OUTPUT}"

      - name: Run comparison against MI300A reference
        run: |
          REF_CSV="${{ steps.reference.outputs.ref_csv }}"
          if [ -z "${REF_CSV}" ]; then
            echo "kernel_name,problem_size,real_ms,sim_ms,abs_error_ms,rel_error" > comparison_ci.csv
            echo "No reference CSV found; wrote empty comparison_ci.csv fallback."
            exit 0
          fi
          python3 workloads/scripts/compare_sim_vs_real.py \
            --ref "${REF_CSV}" \
            --sim sim_results_ci.csv \
            --output comparison_ci.csv

      - name: Run regression-based comparison
        run: |
          REF_CSV="${{ steps.reference.outputs.ref_csv }}"
          if [ -z "${REF_CSV}" ]; then
            echo "kernel,group,label,problem_size,numeric_size,hw_ms,sim_ms,hw_pred_ms,sim_pred_ms" > regression_ci.csv
            echo "No reference CSV found; wrote empty regression_ci.csv fallback."
            exit 0
          fi
          set -o pipefail
          python3 workloads/scripts/compare_regression.py \
            --ref "${REF_CSV}" \
            --sim sim_results_ci.csv \
            --output regression_ci.csv 2>&1 | tee regression_compare.log
          if grep -q "^\[compare_regression\]" regression_compare.log; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "### Regression Parser Diagnostics" >> "${GITHUB_STEP_SUMMARY}"
            echo '```text' >> "${GITHUB_STEP_SUMMARY}"
            grep "^\[compare_regression\]" regression_compare.log >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Generate validation report
        run: |
          mkdir -p benchmark-comparison
          cp comparison_ci.csv benchmark-comparison/comparison_ci.csv
          python3 scripts/generate_validation_report.py

      - name: Generate final summary
        run: |
          set -euo pipefail
          echo "## MI300A Linear Finishable-Size Benchmark" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Branch/ref:** \`${{ github.event.inputs.ref || github.ref }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Commit:** \`${{ github.sha }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Linear stage results" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Stage | Result |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Validation | ${{ needs.validation.result }} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tier 1 | ${{ needs['benchmark-tier1'].result }} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tier-1 summary/gate | ${{ needs['tier1-gate'].result }} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tier 2 | ${{ needs['benchmark-tier2'].result }} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Finishable matrix coverage" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tier | Matrix source | Benchmarks | Finishable sizes |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|---:|---:|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tier 1 | \`benchmark-comparison/generated/mi300a_finishable_tier1_matrix.json\` | ${{ needs.validation.outputs.tier1_count }} | ${{ needs.validation.outputs.tier1_sizes }} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tier 2 | \`benchmark-comparison/generated/mi300a_finishable_tier2_matrix.json\` | ${{ needs.validation.outputs.tier2_count }} | ${{ needs.validation.outputs.tier2_sizes }} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "> Run 24959959195 remains an immutable observation-time / bounded non-terminal snapshot, not a final/current live finishability claim." >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          DATA_LINES=$(tail -n +2 sim_results_ci.csv | wc -l | tr -d ' ')
          COMP_LINES=$(tail -n +2 comparison_ci.csv | wc -l | tr -d ' ')
          REG_LINES=$(tail -n +2 regression_ci.csv | wc -l | tr -d ' ')
          echo "### Result artifacts" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Merged simulation rows: ${DATA_LINES}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Comparison rows: ${COMP_LINES}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Regression rows: ${REG_LINES}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Artifacts: \`benchmark-comparison\`, \`comparison-detailed\`, \`validation-report\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload merged benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            sim_results_ci.csv
            comparison_ci.csv
            regression_ci.csv
          retention-days: 90

      - name: Upload comparison CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-detailed
          path: comparison_ci.csv
          retention-days: 90

      - name: Upload validation report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            docs/validation_report.md
            docs/figures/slowdown_bar_chart.png
            docs/figures/sim_vs_hw_scatter.png
            benchmark-comparison/mi300a_finishable_size_manifest.json
            benchmark-comparison/mi300a_finishable_size_summary.json
            benchmark-comparison/generated/mi300a_finishable_tier1_matrix.json
            benchmark-comparison/generated/mi300a_finishable_tier2_matrix.json
            benchmark-comparison/provenance/mi300a_problem_size_discovery_run_24959959195.json
          if-no-files-found: error
          retention-days: 90
