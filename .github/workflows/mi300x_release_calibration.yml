name: MI300X Release Calibration

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Optional benchmark to run for a preview
        type: string

concurrency:
  group: ${{ github.event_name == 'release' && 'mi300x-release-calibration' || format('mi300x-preview-{0}', github.run_id) }}
  queue: max

permissions:
  contents: read

env:
  CALIBRATION: gpu_perf_scripts/calibration/release/workflow.py
  PSYCOPG: psycopg[binary]==3.2.13
  VERSION: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      run_key: ${{ steps.plan.outputs.run_key }}
      started_at: ${{ steps.plan.outputs.started_at }}
      series: ${{ steps.plan.outputs.series }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "$PSYCOPG"
      - id: plan
        name: Open the calibration report run
        env:
          CALIBRATION_REPORT_DSN: ${{ secrets.CALIBRATION_REPORT_DSN }}
          BENCHMARK: ${{ inputs.benchmark }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python "$CALIBRATION" plan --benchmark "$BENCHMARK" --tag "$TAG" \
            --run-id "$GITHUB_RUN_ID" --version "$VERSION" --revision "$GITHUB_SHA" \
            > plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"
      - name: Link the live report
        env:
          URL: ${{ steps.plan.outputs.url }}
        run: |
          echo "Live calibration results: $URL" >> "$GITHUB_STEP_SUMMARY"

  sweep:
    needs: plan
    name: "${{ matrix.series.benchmark }} (series ${{ matrix.series.id }})"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        series: ${{ fromJSON(needs.plan.outputs.series) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "$PSYCOPG"
      - name: Build benchmark and run series
        env:
          CALIBRATION_REPORT_DSN: ${{ secrets.CALIBRATION_REPORT_DSN }}
          RUN_KEY: ${{ needs.plan.outputs.run_key }}
          SAMPLE: ${{ matrix.series.sample }}
          SERIES: ${{ matrix.series.id }}
        run: |
          go build -o "$RUNNER_TEMP/sample" "./amd/samples/$SAMPLE"
          python "$CALIBRATION" run "$SERIES" "$RUNNER_TEMP/sample" result \
            --run-key "$RUN_KEY" --version "$VERSION" --revision "$GITHUB_SHA"
      - name: Upload series results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: series-${{ matrix.series.id }}
          path: result/results.json
          if-no-files-found: ignore
          overwrite: true
      - name: Upload series logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-logs-${{ matrix.series.id }}
          path: result/runs/*/stdout.log
          if-no-files-found: ignore
          overwrite: true

  finalize:
    needs: [plan, sweep]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "$PSYCOPG"
      - uses: actions/download-artifact@v4
        with:
          pattern: series-*
          path: artifacts
      - name: Finish the calibration report run
        env:
          CALIBRATION_REPORT_DSN: ${{ secrets.CALIBRATION_REPORT_DSN }}
          BENCHMARK: ${{ inputs.benchmark }}
          RUN_KEY: ${{ needs.plan.outputs.run_key }}
          STARTED_AT: ${{ needs.plan.outputs.started_at }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
        run: |
          python "$CALIBRATION" finalize artifacts --benchmark "$BENCHMARK" \
            --run-key "$RUN_KEY" --started-at "$STARTED_AT" --sweep-result "$SWEEP_RESULT"
