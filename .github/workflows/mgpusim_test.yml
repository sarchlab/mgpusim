name: MGPUSim Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Build
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0

      - name: Generate mocks
        run: go generate ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: "v2.13.2"
          # Use a pinned release that supports the configured Go toolchain.
          install-mode: binary
          args: --timeout=10m
          skip-cache: true

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [compile, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0

      - name: Generate mocks
        run: go generate ./...

      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo@v2.32.1

      - name: Component architecture guards
        env:
          GOTOOLCHAIN: local
        run: go test ./internal/architecture -count=1 -v

      # The page-migration scenarios build and run full multi-GPU simulations;
      # they have their own jobs below.
      - name: Unit Test
        run: ginkgo -r --skip-package=mccl,internal/architecture,amd/tests/pagemigration

  # Lightweight placeholder for the NVIDIA trace-driven simulator (nvidia/).
  # It only builds, tests, and lints nvidia/; collecting traces needs an
  # NVIDIA GPU and is not part of CI.
  nvidia_test:
    name: NVIDIA Test
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./nvidia/...

      - name: Test
        run: go test ./nvidia/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: "v2.13.2"
          install-mode: binary
          args: --timeout=10m ./nvidia/...
          skip-cache: true

  deterministicity_test:
    name: Deterministicity Test
    runs-on: ubuntu-latest
    needs: [unit_test]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: List Directory Contents
        run: ls -R

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Check Python
        run: python3 --version

      - name: Run Deterministicity Test
        run: python test.py
        working-directory: amd/tests/deterministic/

  disassembler_test:
    name: Disassembler Test (GFX942)
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run Disassembler Test
        run: ./test-disasm.sh --check
        working-directory: amd/benchmarks/amdappsdk/vectoradd/native/

  # =============================================================================
  # GCN3 (R9Nano) Tests
  # =============================================================================

  gcn3_emu_test:
    name: GCN3 Emulation Test
    runs-on: Github-Large-1
    needs: [unit_test]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run GCN3 Emulation Test
        timeout-minutes: 60
        run: |
          go build
          ./acceptance -num-gpu=1 -no-timing -arch=gcn3
        working-directory: amd/tests/acceptance/

  gcn3_single_gpu_timing_test:
    name: GCN3 Single GPU Timing Test (${{ matrix.shard.name }})
    runs-on: Github-Large-1
    needs: [gcn3_emu_test]
    strategy:
      fail-fast: false
      matrix:
        # Split the timing benchmarks across runners so no single shard
        # approaches the 60-minute job timeout. nbody dominates the runtime
        # (~40 min on its own), so it gets a dedicated shard; atax and bicg
        # are the next heaviest, and everything else fits comfortably together.
        shard:
          - name: nbody
            filter: "^nbody$"
          - name: polybench
            filter: "^(atax|bicg)$"
          - name: others
            filter: "^(fir|aes|kmeans|pagerank|matrixmultiplication|matrixtranspose|bitonicsort|simpleconvolution|floydwarshall|relu|bfs|stencil2d|spmv|fft|vectoradd|nw)$"
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run GCN3 Single GPU Timing Test
        timeout-minutes: 60
        run: |
          go build
          ./acceptance -num-gpu=1 -arch=gcn3 -benchmark='${{ matrix.shard.filter }}'
        working-directory: amd/tests/acceptance/

  # Page migration between GPUs. Pages migrate on faults by default, so the
  # workloads need no flags; the policy and its parameters are part of the
  # system specification. The scenarios (lossless faults, windows on the data
  # movers, dirty lines and reused frames, counters, throttling, pins, and
  # checkpoints) are Go tests that build the platforms themselves.
  gcn3_page_migration_test:
    name: GCN3 Page Migration Test (${{ matrix.suite.name }})
    runs-on: Github-Large-1
    needs: [gcn3_emu_test]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: scenarios
            directory: .
            run: go test ./amd/tests/pagemigration/ -run '/r9nano' -count=1 -timeout 60m -v
          - name: workloads
            directory: amd/tests/acceptance/
            run: go build && ./acceptance -only-page-migration -arch=gcn3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run GCN3 Page Migration Test
        timeout-minutes: 120
        run: ${{ matrix.suite.run }}
        working-directory: ${{ matrix.suite.directory }}

  # =============================================================================
  # CDNA3 (MI300X) Tests
  # =============================================================================

  cdna3_emu_test:
    name: CDNA3 Emulation Test
    runs-on: Github-Large-1
    needs: [unit_test]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run CDNA3 Emulation Test
        timeout-minutes: 60
        run: |
          go build
          ./acceptance -num-gpu=1 -no-timing -arch=cdna3
        working-directory: amd/tests/acceptance/

  cdna3_single_gpu_timing_test:
    name: CDNA3 Single GPU Timing Test
    runs-on: Github-Large-1
    needs: [cdna3_emu_test]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run CDNA3 Single GPU Timing Test
        timeout-minutes: 60
        run: |
          go build
          ./acceptance -num-gpu=1 -arch=cdna3
        working-directory: amd/tests/acceptance/

  # Page migration between MI300X GPUs; see gcn3_page_migration_test. A page
  # is 2 MiB here, so every migration copies 2 MiB through the MALLs.
  cdna3_page_migration_test:
    name: CDNA3 Page Migration Test (${{ matrix.suite.name }})
    runs-on: Github-Large-1
    needs: [cdna3_emu_test]
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: scenarios
            directory: .
            run: go test ./amd/tests/pagemigration/ -run '/mi300x' -count=1 -timeout 110m -v
          - name: workloads
            directory: amd/tests/acceptance/
            run: go build && ./acceptance -only-page-migration -arch=cdna3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run CDNA3 Page Migration Test
        timeout-minutes: 120
        run: ${{ matrix.suite.run }}
        working-directory: ${{ matrix.suite.directory }}
