name: MGPUSim Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit_test:
    name: Compile, Lint & Unit Test
    runs-on: self-hosted
    steps:
      - name: Clean stale git credentials
        run: |
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --system --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Build
        run: go build ./...

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0

      - name: Generate mocks
        run: go generate ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: "v2.11.2"
          # Build golangci-lint with the configured Go toolchain to avoid
          # Go version mismatch (linter built with older Go than target).
          install-mode: binary
          args: --timeout=10m
          skip-cache: true

      - name: Run parser robustness tests
        run: python3 -m unittest discover -s workloads/scripts/tests -p 'test_*.py' -v

      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo

      - name: Unit Test
        run: ginkgo -r --skip-package=mccl

  deterministicity_test:
    name: Deterministicity Test
    runs-on: self-hosted
    needs: [unit_test]
    steps:
      - name: Clean stale git credentials
        run: |
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --system --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: List Directory Contents
        run: ls -R

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Check Python
        run: python3 --version

      - name: Run Deterministicity Test
        run: python test.py
        working-directory: amd/tests/deterministic/

  disassembler_test:
    name: Disassembler Test (GFX942)
    runs-on: self-hosted
    needs: [unit_test]
    steps:
      - name: Clean stale git credentials
        run: |
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --system --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run Disassembler Test
        run: ./test-disasm.sh --check
        working-directory: amd/benchmarks/amdappsdk/vectoradd/native/

  # =============================================================================
  # CDNA3 (MI300A) Tests
  # =============================================================================

  cdna3_emu_test:
    name: CDNA3 Emulation (${{ matrix.benchmark_group }})
    runs-on: self-hosted
    needs: [unit_test]
    strategy:
      fail-fast: false
      matrix:
        benchmark_group: [polybench, rodinia, heteromark_shoc, parboil_misc]
        include:
          - benchmark_group: polybench
            benchmark_filter: '^(atax|bicg|2dconvolution|2mm|3dconvolution|3mm|correlation|covariance|fdtd2d|gemm|gesummv|gramschmidt|mvt|syr2k|syrk)$'
          - benchmark_group: rodinia
            benchmark_filter: '^(backprop|gaussian|hotspot|hotspot3D|lavaMD|nn|pathfinder|nw|nbody|fft|srad)$'
          - benchmark_group: heteromark_shoc
            benchmark_filter: '^(bs|ep|fir|aes|hist|ga|kmeans|pagerank|bfs|stencil2d|spmv|reduction|sort|scan|shoc_gemm|triad|memcopy|vectoradd)$'
          - benchmark_group: parboil_misc
            benchmark_filter: '^(parboil_cutcp|parboil_histo|parboil_sad|parboil_sgemm|parboil_tpacf|matrixmultiplication|matrixtranspose|simpleconvolution|floydwarshall|fastwalshtransform|bitonicsort)$'
    steps:
      - name: Clean stale git credentials
        run: |
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --system --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run CDNA3 Emulation Test (${{ matrix.benchmark_group }})
        timeout-minutes: 30
        run: |
          go build
          ./acceptance -num-gpu=1 -no-timing -benchmark="${{ matrix.benchmark_filter }}"
        working-directory: amd/tests/acceptance/

  # -------------------------------------------------------------------------
  # Tiered CI: Only Tier 1 (fast) timing benchmarks run in regular CI to keep
  # CI runtime bounded. Slow timing benchmarks are excluded from this gate.
  # All benchmarks are still tested in emulation mode above.
  # -------------------------------------------------------------------------
  cdna3_timing_test:
    name: CDNA3 Timing (${{ matrix.benchmark_group }})
    runs-on: self-hosted
    needs: [unit_test]
    strategy:
      fail-fast: false
      matrix:
        benchmark_group: [polybench_fast, rodinia_fast, heteromark_shoc]
        include:
          - benchmark_group: polybench_fast
            # 3mm excluded: per-XCD L2 routing causes coherence mismatch without pre-kernel flush (see issue tracker)
            benchmark_filter: "^(correlation|covariance|fdtd2d)$"
          - benchmark_group: rodinia_fast
            benchmark_filter: "^(lavaMD|nn|pathfinder|srad)$"
          - benchmark_group: heteromark_shoc
            benchmark_filter: "^(fir|shoc_gemm|vectoradd|stencil2d|memcopy)$"
    steps:
      - name: Clean stale git credentials
        run: |
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --system --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install build dependencies
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc || echo "WARNING: sudo failed, gcc may already be installed"
          fi

      - name: Run CDNA3 Timing Test (${{ matrix.benchmark_group }})
        timeout-minutes: 45
        run: |
          go build
          ./acceptance -num-gpu=1 --only-timing -benchmark="${{ matrix.benchmark_filter }}"
        working-directory: amd/tests/acceptance/
